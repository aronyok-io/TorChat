<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Onion Whisper</title><link rel="stylesheet" href="/style.css"></head>
<body><main><section id="welcome" class="card"><div class="mark">◉</div><h1>Onion Whisper</h1><p>A private room over Tor. Your passphrase encrypts every message before it leaves this page.</p><form id="join"><label>Your name<input id="name" maxlength="32" autocomplete="nickname" required placeholder="e.g. River"></label><label>Shared passphrase<input id="password" type="password" minlength="12" autocomplete="current-password" required placeholder="At least 12 characters"></label><button>Enter private room</button></form><small>Use a unique, long passphrase and share it separately from this link. This room retains no message history.</small></section><section id="chat" hidden><header><div><span class="dot"></span><strong>Private room</strong><small id="status">Connecting…</small></div><button class="quiet" id="leave">Leave</button></header><div id="messages" aria-live="polite"></div><form id="compose"><input id="text" maxlength="4000" autocomplete="off" placeholder="Write a message…" required><button aria-label="Send">Send</button></form></section></main><script src="/app.js"></script></body></html>
